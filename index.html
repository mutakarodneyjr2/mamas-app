<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAMAS - Matuumu Alumni Mutual Aid Association</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950">
    <div id="root">
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;background-color:#020617;color:white;font-family:system-ui,sans-serif;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:3px solid rgba(245, 158, 11, 0.2);border-top-color:#f59e0b;border-radius:50%;animation:mamas-spin 1s linear infinite;margin:0 auto 16px;"></div>
          <p style="color:#94a3b8;font-size:14px;font-weight:500;letter-spacing:0.5px;">Loading MAMAS...</p>
        </div>
      </div>
      <style>
        @keyframes mamas-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
