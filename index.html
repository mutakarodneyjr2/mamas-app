<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MAMAS - Matuumu Alumni Mutual Aid Association</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root">
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;background-color:#060c1a;color:white;font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
        <div style="text-align:center;">
          <div style="width:44px;height:44px;border:3px solid rgba(37, 99, 235, 0.2);border-top-color:#2563eb;border-radius:50%;animation:mamas-spin 0.9s linear infinite;margin:0 auto 16px;"></div>
          <p style="color:#94a3b8;font-size:13px;font-weight:600;letter-spacing:0.5px;">Loading MAMAS Portal...</p>
        </div>
      </div>
      <style>
        @keyframes mamas-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
